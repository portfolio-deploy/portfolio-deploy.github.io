<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>寮犱簯 路 AI浜у搧杩愯惀浣滃搧闆?/title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#ffffff;--section-bg:#f5f5f7;--text-primary:#1d1d1f;--text-secondary:#6e6e73;--text-tertiary:#86868b;--accent-blue:#0071e3;--accent-gold:#d4af37;--border:#d2d2d7;--card-bg:#ffffff;--card-shadow:0 4px 24px rgba(0,0,0,0.06);--radius:18px;--max-width:1200px;--nav-height:52px}
html{scroll-behavior:smooth;font-size:16px}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif;color:var(--text-primary);background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:hidden;line-height:1.47059}

#particle-canvas{position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:1}

nav{position:fixed;top:0;left:0;right:0;height:var(--nav-height);background:rgba(255,255,255,0.88);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,0.06);z-index:100;display:flex;align-items:center;justify-content:center;transition:transform .4s}
.nav-inner{width:min(var(--max-width),90vw);display:flex;justify-content:space-between;align-items:center}
.nav-logo{font-weight:700;font-size:.9rem;letter-spacing:-.02em;background:linear-gradient(135deg,var(--accent-blue),var(--accent-gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.nav-links{display:flex;gap:28px;list-style:none}
.nav-links a{text-decoration:none;font-size:.78rem;color:var(--text-secondary);transition:all .2s;letter-spacing:.01em;position:relative}
.nav-links a::after{content:'';position:absolute;bottom:-2px;left:0;width:0;height:1.5px;background:linear-gradient(90deg,var(--accent-blue),var(--accent-gold));transition:width .3s}
.nav-links a:hover{color:var(--text-primary)}.nav-links a:hover::after{width:100%}

.hero{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:120px 24px 80px;background:linear-gradient(180deg,#fff 0%,#f5f5f7 100%);overflow:hidden}
.hero-badge{display:inline-flex;align-items:center;gap:6px;padding:8px 20px;border-radius:100px;background:linear-gradient(135deg,rgba(0,113,227,0.08),rgba(212,175,55,0.08));border:1px solid rgba(212,175,55,0.15);color:var(--accent-blue);font-size:.85rem;font-weight:500;letter-spacing:.02em;margin-bottom:28px;opacity:0;animation:fadeUp .8s .2s forwards}
.hero h1{font-size:clamp(2.8rem,7vw,5rem);font-weight:700;letter-spacing:-.03em;line-height:1.05;margin-bottom:16px;opacity:0;animation:fadeUpScale 1s .4s forwards}
.hero h1 .highlight-blue{background:linear-gradient(135deg,#0071e3,#5ac8fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero h1 .highlight-gold{background:linear-gradient(135deg,#d4af37,#f5e6b8,#d4af37);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer 3s linear infinite}
@keyframes shimmer{0%{background-position:0% center}100%{background-position:200% center}}
.hero-sub{font-size:clamp(1.1rem,2vw,1.5rem);color:var(--text-secondary);max-width:680px;margin:0 auto 32px;line-height:1.6;opacity:0;animation:fadeUp .8s .6s forwards}
.hero-actions{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;opacity:0;animation:fadeUp .8s .8s forwards}
.btn-primary{display:inline-flex;align-items:center;gap:8px;padding:14px 32px;border-radius:980px;background:linear-gradient(135deg,var(--accent-blue),#3a8cff);color:#fff;text-decoration:none;font-size:.95rem;font-weight:500;transition:all .3s;border:none;cursor:pointer;box-shadow:0 4px 14px rgba(0,113,227,0.3)}
.btn-primary:hover{transform:scale(1.05) translateY(-2px);box-shadow:0 6px 20px rgba(0,113,227,0.4)}
.btn-secondary{display:inline-flex;align-items:center;gap:8px;padding:14px 32px;border-radius:980px;background:transparent;color:var(--text-primary);text-decoration:none;font-size:.95rem;font-weight:500;border:1.5px solid rgba(0,0,0,0.12);transition:all .3s}
.btn-secondary:hover{border-color:var(--accent-gold);transform:translateY(-2px)}

.hero-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;margin-top:60px;width:min(var(--max-width),90vw);opacity:0;animation:fadeUp .8s 1s forwards}
.hero-stat{text-align:center;padding:24px 12px;background:rgba(255,255,255,0.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:var(--radius);border:1px solid rgba(212,175,55,0.1);transition:all .4s}
.hero-stat:hover{transform:translateY(-6px);border-color:rgba(212,175,55,0.3);box-shadow:0 8px 32px rgba(212,175,55,0.1)}
.hero-stat .num{font-size:2rem;font-weight:700;background:linear-gradient(135deg,var(--accent-blue),var(--accent-gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;display:inline-block;transition:transform .3s}
.hero-stat:hover .num{transform:scale(1.08)}
.hero-stat .label{font-size:.78rem;color:var(--text-secondary);margin-top:4px}

section{position:relative;z-index:2;padding:100px 24px}
.section-inner{width:min(var(--max-width),90vw);margin:0 auto}
.section-label{font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.12em;background:linear-gradient(135deg,var(--accent-blue),var(--accent-gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:12px}
.section-title{font-size:clamp(1.8rem,4vw,3rem);font-weight:700;letter-spacing:-.025em;margin-bottom:16px;line-height:1.15}
.section-desc{font-size:1.1rem;color:var(--text-secondary);max-width:620px;line-height:1.6;margin-bottom:48px}

.project-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:24px;margin-bottom:48px;perspective:1200px}
.project-card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--card-shadow);border:1px solid rgba(0,0,0,0.04);padding:36px 32px;transition:all .5s;opacity:0;transform:translateY(40px) scale(0.95);position:relative;overflow:hidden;cursor:pointer}
.project-card::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:3px;background:linear-gradient(90deg,transparent,var(--accent-gold),var(--accent-blue),transparent);transition:left .8s}
.project-card.visible{opacity:1;transform:translateY(0) scale(1)}
.project-card.visible::before{left:100%}
.project-card:hover{transform:translateY(-8px) scale(1.01);box-shadow:0 12px 40px rgba(0,0,0,0.1)}
.project-card:active{transform:scale(0.97)}
.project-card .tag{display:inline-block;padding:3px 10px;border-radius:6px;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:14px}
.tag-sop{background:linear-gradient(135deg,#fff8e1,#ffe082);color:#f57f17}
.tag-shixing{background:linear-gradient(135deg,#e8f0fe,#d4e4ff);color:#1a73e8}
.tag-netease{background:linear-gradient(135deg,#fce8e6,#ffd5d0);color:#d93025}
.tag-meituan{background:linear-gradient(135deg,#e6f4ea,#c8e6d4);color:#137333}
.project-card .company{font-size:.78rem;color:var(--text-secondary);margin-bottom:4px}
.project-card h3{font-size:1.3rem;font-weight:700;letter-spacing:-.01em;margin-bottom:12px}
.project-card p{font-size:.9rem;color:var(--text-secondary);line-height:1.6;margin-bottom:16px}
.project-metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.project-metric{padding:12px 10px;background:var(--section-bg);border-radius:10px;text-align:center;transition:all .3s}
.project-card:hover .project-metric{background:linear-gradient(135deg,#f5f5f7,rgba(212,175,55,0.04))}
.project-metric .val{font-size:1.1rem;font-weight:700;word-break:break-all}
.project-metric .val.green{color:#137333}.project-metric .val.blue{color:#1a73e8}.project-metric .val.red{color:#d93025}
.project-metric .lbl{font-size:.7rem;color:var(--text-tertiary);margin-top:2px}

.sop-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;margin-top:40px}
.sop-card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--card-shadow);border:1px solid rgba(0,0,0,0.04);padding:28px;opacity:0;transform:translateY(30px);transition:all .6s}
.sop-card.visible{opacity:1;transform:translateY(0)}
.sop-card:hover{border-color:rgba(212,175,55,0.15)}
.sop-card .step-icon{font-size:1.8rem;margin-bottom:10px}
.sop-card h4{font-size:1rem;font-weight:600;margin-bottom:8px}
.sop-card p{font-size:.84rem;color:var(--text-secondary);line-height:1.6;margin-bottom:10px}
.sop-tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.65rem;font-weight:600;background:rgba(212,175,55,0.12);color:var(--accent-gold);margin-right:4px;margin-bottom:4px}

.charts-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:32px;margin-top:48px}
.chart-box{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--card-shadow);border:1px solid rgba(0,0,0,0.04);padding:32px;opacity:0;transform:translateY(40px);transition:all .7s;position:relative;overflow:hidden}
.chart-box.visible{opacity:1;transform:translateY(0)}
.chart-box:hover{box-shadow:0 8px 32px rgba(0,0,0,0.08)}
.chart-box h4{font-size:1rem;font-weight:600;margin-bottom:20px;letter-spacing:-.01em}
.chart-box .chart-desc{font-size:.78rem;color:var(--text-tertiary);margin-top:12px;text-align:center}
.chart-box canvas{max-height:280px;width:100%!important}
.chart-full{grid-column:1/-1}

.data-wall{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:linear-gradient(135deg,rgba(212,175,55,0.1),rgba(0,113,227,0.1));border-radius:var(--radius);overflow:hidden;margin-top:40px;border:1px solid rgba(212,175,55,0.1)}
.data-wall-item{background:var(--card-bg);padding:40px 24px;text-align:center;opacity:0;transform:scale(0.85);transition:all .7s}
.data-wall-item.visible{opacity:1;transform:scale(1)}
.data-wall-item:hover{background:linear-gradient(135deg,#fff,rgba(212,175,55,0.02))}
.data-wall-item .val{font-size:2.4rem;font-weight:700;background:linear-gradient(135deg,var(--accent-blue),var(--accent-gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;display:inline-block;transition:transform .3s}
.data-wall-item:hover .val{transform:scale(1.05)}
.data-wall-item .lbl{font-size:.82rem;color:var(--text-secondary);margin-top:6px}
.data-wall-item .src{font-size:.7rem;color:var(--text-tertiary);margin-top:2px;padding:2px 8px;display:inline-block;border-radius:4px;background:var(--section-bg)}

.timeline{position:relative;padding-left:32px;margin-top:40px}
.timeline::before{content:'';position:absolute;left:8px;top:0;bottom:0;width:2px;background:linear-gradient(180deg,var(--accent-gold),var(--accent-blue),transparent)}
.timeline-item{position:relative;margin-bottom:40px;padding:20px 24px;background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--card-shadow);border:1px solid rgba(0,0,0,0.03);opacity:0;transform:translateX(-30px);transition:all .6s}
.timeline-item.visible{opacity:1;transform:translateX(0)}
.timeline-item:hover{border-color:rgba(212,175,55,0.15);transform:translateX(0) translateY(-2px)}
.timeline-item::before{content:'';position:absolute;left:-28px;top:24px;width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,var(--accent-gold),var(--accent-blue));border:2px solid #fff;box-shadow:0 0 0 3px var(--accent-gold)}
.timeline-item .date{font-size:.78rem;background:linear-gradient(135deg,var(--accent-blue),var(--accent-gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:600;margin-bottom:4px}
.timeline-item h4{font-size:1rem;font-weight:600;margin-bottom:4px}
.timeline-item p{font-size:.85rem;color:var(--text-secondary);line-height:1.5}

.skills-section{background:var(--section-bg);position:relative}
.skills-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px;margin-top:40px}
.skill-category{opacity:0;transform:translateY(30px);transition:all .7s;padding:24px;background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--card-shadow);border:1px solid rgba(0,0,0,0.03)}
.skill-category.visible{opacity:1;transform:translateY(0)}
.skill-category:hover{border-color:rgba(212,175,55,0.15)}
.skill-category h4{font-size:.9rem;font-weight:600;margin-bottom:20px;letter-spacing:.02em;background:linear-gradient(135deg,var(--accent-blue),var(--accent-gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.skill-item{margin-bottom:14px}.skill-item:last-child{margin-bottom:0}
.skill-item .skill-name{display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:4px}
.skill-bar{height:5px;background:#e8e8ed;border-radius:3px;overflow:hidden;position:relative}
.skill-bar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent-blue),var(--accent-gold));width:0%;transition:width 1.4s;position:relative}
.skill-bar-fill::after{content:'';position:absolute;top:0;right:0;width:12px;height:100%;background:rgba(255,255,255,0.3);border-radius:3px;animation:barPulse 2s ease-in-out infinite}
@keyframes barPulse{0%,100%{opacity:.3}50%{opacity:.7}}
.skill-category.visible .skill-bar-fill{width:var(--pct)}

footer{position:relative;z-index:2;background:#1d1d1f;color:#f5f5f7;padding:80px 24px 40px;text-align:center}
footer h2{font-size:2rem;font-weight:700;letter-spacing:-.02em;margin-bottom:8px;background:linear-gradient(135deg,#f5f5f7,var(--accent-gold-light,#f5e6b8),#f5f5f7);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer 4s linear infinite}
footer p{color:#a1a1a6;font-size:.9rem;margin-bottom:24px}
footer .qr-section{margin:24px 0;display:flex;flex-direction:column;align-items:center;gap:8px}
footer .qr-section img{border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.3)}
footer .qr-section span{font-size:.78rem;color:#6e6e73}
footer .contact{display:flex;justify-content:center;gap:32px;flex-wrap:wrap;margin-top:16px}
footer .contact a,footer .contact span{color:var(--accent-gold-light,#f5e6b8);text-decoration:none;font-size:.9rem;transition:all .2s;padding:6px 16px;border-radius:100px;border:1px solid rgba(212,175,55,0.15)}
footer .contact a:hover{background:rgba(212,175,55,0.08);border-color:var(--accent-gold);transform:translateY(-2px)}
footer .copy{margin-top:48px;font-size:.72rem;color:#6e6e73}

@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeUpScale{from{opacity:0;transform:translateY(30px) scale(0.96)}to{opacity:1;transform:translateY(0) scale(1)}}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,0.55);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);justify-content:center;align-items:center;padding:24px;opacity:0;transition:opacity .35s}
.modal-overlay.open{display:flex;opacity:1}
.modal-box{background:#fff;border-radius:20px;max-width:780px;width:100%;max-height:85vh;overflow-y:auto;overflow-x:hidden;padding:36px 28px;position:relative;transform:scale(0.85) translateY(20px);transition:transform .4s cubic-bezier(.25,.46,.45,.94);box-shadow:0 24px 80px rgba(0,0,0,0.15)}
.modal-overlay.open .modal-box{transform:scale(1) translateY(0)}
.modal-close{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;border:none;background:var(--section-bg);color:var(--text-secondary);font-size:1.1rem;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:#e8e8ed;color:var(--text-primary);transform:rotate(90deg)}
.modal-box::-webkit-scrollbar{width:4px}.modal-box::-webkit-scrollbar-track{background:transparent}.modal-box::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.modal-tag{display:inline-block;padding:4px 12px;border-radius:6px;font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.modal-tag.shixing{background:#e8f0fe;color:#1a73e8}.modal-tag.netease{background:#fce8e6;color:#d93025}.modal-tag.meituan{background:#e6f4ea;color:#137333}
.modal-company{font-size:.82rem;color:var(--text-secondary);margin-bottom:4px}
.modal-box h2{font-size:1.4rem;font-weight:700;letter-spacing:-.02em;margin-bottom:14px}
.modal-box h2 .hl{background:linear-gradient(135deg,var(--accent-blue),var(--accent-gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.modal-desc{font-size:.88rem;color:var(--text-secondary);line-height:1.6;margin-bottom:18px;word-break:break-word;overflow-wrap:break-word}
.modal-metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
.modal-metric{background:var(--section-bg);border-radius:12px;padding:16px 12px;text-align:center}
.modal-metric .val{font-size:1.4rem;font-weight:700;background:linear-gradient(135deg,var(--accent-blue),var(--accent-gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;word-break:break-word}
.modal-metric .lbl{font-size:.8rem;color:var(--text-secondary);margin-top:3px}
.modal-metric .note{font-size:.68rem;color:var(--text-tertiary);margin-top:1px}
.modal-details{border-top:1px solid var(--border);padding-top:16px}
.modal-detail-item{display:flex;gap:10px;margin-bottom:10px;align-items:flex-start}
.modal-detail-item .icon{font-size:1rem;flex-shrink:0;margin-top:1px}
.modal-detail-item .text{font-size:.8rem;color:var(--text-secondary);line-height:1.5;word-break:break-word;overflow-wrap:break-word}

@media(max-width:900px){.hero-stats{grid-template-columns:repeat(2,1fr)}.charts-grid{grid-template-columns:1fr}.data-wall{grid-template-columns:repeat(2,1fr)}.nav-links{display:none}}
@media(max-width:600px){.hero-stats{grid-template-columns:repeat(2,1fr);gap:12px}section{padding:56px 16px}.project-grid{grid-template-columns:1fr}.data-wall{grid-template-columns:repeat(2,1fr)}.hero-stat .num{font-size:1.5rem}.data-wall-item .val{font-size:1.8rem}.timeline-item{padding:16px}.modal-box{padding:28px 20px}.modal-metrics{grid-template-columns:1fr}.modal-box h2{font-size:1.2rem}}
</style>
</head>
<body>

<canvas id="particle-canvas"></canvas>

<nav><div class="nav-inner"><span class="nav-logo">寮犱簯 路 浣滃搧闆?/span><ul class="nav-links"><li><a href="#projects">椤圭洰</a></li><li><a href="#sop">SOP</a></li><li><a href="#data">鏁版嵁</a></li><li><a href="#skills">鑳藉姏</a></li><li><a href="#contact">鑱旂郴</a></li></ul></div></nav>

<div class="modal-overlay" id="modal"><div class="modal-box" id="modalBox"><button class="modal-close" onclick="closeModal()">鉁?/button><div id="modalContent"></div></div></div>

<!-- Hero -->
<section class="hero">
  <div class="hero-badge">馃幆 AI浜у搧杩愯惀 路 鐢ㄦ埛澧為暱鏂瑰悜</div>
  <h1>鐢?<span class="highlight-blue">AI</span> 椹卞姩澧為暱<br>鐢?<span class="highlight-gold">鏁版嵁</span> 鍋氬喅绛?/h1>
  <p class="hero-sub">1500+鏍稿績鏈堟椿 路 28%绀剧兢杞寲鐜?路 娴佸け鐜囬檷浣?7%<br>涓変釜瀹炴垬椤圭洰 + 瀹屾暣SOP浣撶郴锛岄獙璇丄I椹卞姩鐨勭敤鎴疯繍钀ユ柟娉曡</p>
  <div class="hero-actions">
    <a href="#projects" class="btn-primary">鏌ョ湅椤圭洰 鈫?/a>
    <a href="#sop" class="btn-secondary">鏌ョ湅SOP 鈫?/a>
  </div>
  <div class="hero-stats">
    <div class="hero-stat"><div class="num" data-target="1500">0+</div><div class="label">鏍稿績鏈堟椿</div></div>
    <div class="hero-stat"><div class="num" data-target="2500">0+</div><div class="label">绉佸煙绀剧兢</div></div>
    <div class="hero-stat"><div class="num" data-target="27">0%</div><div class="label">娴佸け鐜囦笅闄?/div></div>
    <div class="hero-stat"><div class="num" data-target="28">0%</div><div class="label">绀剧兢杞寲鐜?/div></div>
  </div>
</section>

<!-- Projects -->
<section id="projects" style="background:var(--section-bg);">
  <div class="section-inner">

M.prototype.draw=function(){if(this.trail.length<2)return;for(var i=1;i<this.trail.length;i++){var t0=this.trail[i-1],t1=this.trail[i];var r=1-(i/this.max);var a=this.op*r*0.85;var w=this.size*(0.2+r*0.8);ctx.beginPath();ctx.moveTo(t0.x,t0.y);ctx.lineTo(t1.x,t1.y);ctx.strokeStyle=this.isGold?'rgba(255,215,80,'+a+')':'rgba(100,200,255,'+a+')';ctx.lineWidth=w;ctx.lineCap='round';ctx.stroke();}
if(this.trail.length>1){var prev=this.trail[1];var ang=Math.atan2(this.y-prev.y,this.x-prev.x);var hl=this.size*3,hw=this.size*0.5;ctx.save();ctx.translate(this.x,this.y);ctx.rotate(ang);ctx.shadowBlur=this.isGold?12:6;ctx.shadowColor=this.isGold?'rgba(255,215,80,0.15)':'rgba(100,200,255,0.1)';var g=ctx.createRadialGradient(0,0,0,0,0,hl);if(this.isGold){g.addColorStop(0,'rgba(255,240,180,'+(this.op*2.5)+')');g.addColorStop(0.2,'rgba(255,215,80,'+(this.op*1.8)+')');g.addColorStop(0.6,'rgba(212,175,55,'+(this.op*0.6)+')');g.addColorStop(1,'rgba(212,175,55,0)')}else{g.addColorStop(0,'rgba(200,240,255,'+(this.op*2)+')');g.addColorStop(0.3,'rgba(80,200,255,'+(this.op*1.2)+')');g.addColorStop(1,'rgba(0,113,227,0)')}
ctx.beginPath();ctx.ellipse(0,0,hl,hw,0,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();ctx.shadowBlur=0;ctx.restore()}};
function D(){this.x=Math.random()*c.width;this.y=Math.random()*c.height;this.s=Math.random()*0.6+0.2;this.bo=Math.random()*0.03+0.01;this.ps=Math.random()*0.008+0.002;this.off=Math.random()*Math.PI*2;this.dx=(Math.random()-0.5)*0.04;this.dy=(Math.random()-0.5)*0.04;}
D.prototype.update=function(t){this.x+=this.dx;this.y+=this.dy;this.o=this.bo+Math.sin(t*this.ps+this.off)*0.015;if(this.x<-10)this.x=c.width+10;if(this.x>c.width+10)this.x=-10;if(this.y<-10)this.y=c.height+10;if(this.y>c.height+10)this.y=-10;};
D.prototype.draw=function(){ctx.beginPath();ctx.arc(this.x,this.y,this.s,0,Math.PI*2);ctx.fillStyle='rgba(212,175,55,'+Math.max(0,this.o)+')';ctx.fill();};
var mcnt=Math.min(48,Math.floor(c.width*c.height/20000));for(var i=0;i<mcnt;i++){var m=new M();m.y=-Math.random()*c.height*0.7;m.op=Math.random()*0.12+0.08;meteors.push(m);}
var dcnt=Math.min(30,Math.floor(c.width*c.height/40000));for(i=0;i<dcnt;i++)dust.push(new D());
var aid;function ani(t){ctx.clearRect(0,0,c.width,c.height);dust.forEach(function(d){d.update(t||0);d.draw();});meteors.forEach(function(m){m.update(t||0);m.draw();});aid=requestAnimationFrame(ani);}
document.addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY;});document.addEventListener('visibilitychange',function(){if(document.hidden)cancelAnimationFrame(aid);else ani();});ani();})();

// Observer
var ob=new IntersectionObserver(function(entries){entries.forEach(function(e){if(e.isIntersecting){e.target.classList.add('visible');if(e.target.classList.contains('chart-box'))initCharts();}});},{threshold:0.1,rootMargin:'0px 0px -50px 0px'});
document.querySelectorAll('.project-card,.chart-box,.data-wall-item,.timeline-item,.skill-category,.sop-card').forEach(function(el){ob.observe(el);});

// CountUp
var co=new IntersectionObserver(function(entries){entries.forEach(function(e){if(e.isIntersecting){var el=e.target,t=parseInt(el.dataset.target),cur=0,st=Math.ceil(t/60);var int=setInterval(function(){cur+=st;if(cur>=t){cur=t;clearInterval(int);}el.textContent=cur+(el.textContent.endsWith('%')?'%':'+');},20);co.unobserve(el);}});},{threshold:0.5});
document.querySelectorAll('.hero-stat .num[data-target]').forEach(function(el){co.observe(el);});

var ls=0;
window.addEventListener('scroll',function(){var c=window.scrollY;document.querySelector('nav').style.transform=c>ls&&c>100?'translateY(-100%)':'translateY(0)';ls=c;},{passive:true});

var c4=document.getElementById('chartFunnel').getContext('2d');new Chart(c4,{type:'bar',data:{labels:['鍏ョ兢鐢ㄦ埛','瀹屾垚棣栧崟','澶嶈喘鐢ㄦ埛'],datasets:[{label:'杞寲浜烘暟',data:[45000,12600,4410],backgroundColor:[_g(c4,'rgba(0,113,227,0.5)','rgba(0,113,227,0.2)'),_g(c4,'rgba(0,113,227,0.7)','rgba(0,113,227,0.4)'),_g(c4,'rgba(212,175,55,0.6)','rgba(212,175,55,0.3)')],borderColor:[_c.blue,_c.blue,_c.gold],borderWidth:2,borderRadius:6,borderSkipped:false}]},options:{responsive:true,maintainAspectRatio:true,indexAxis:'y',animation:{duration:1200,easing:'easeOutQuart'},plugins:{legend:{display:false},tooltip:{callbacks:{label:function(ctx){return ctx.label+': '+ctx.parsed.toLocaleString()+'浜?}}}},scales:{x:{beginAtZero:true,grid:{color:'rgba(0,0,0,0.04)'},ticks:{callback:function(v){return v>=10000?(v/10000).toFixed(1)+'涓?:v}}},y:{grid:{display:false}}}}});
